require conf/distro/poky.conf

DISTRO          = "flatsat2"
DISTRO_NAME     = "FlatSat2"
DISTRO_VERSION  = "1.0-snapshot-${DATE}"
TARGET_VENDOR   = "-spacelab"
MAINTAINER      = "carlos.porto@spacelab.ufsc.br"
SDK_VENDOR      = "-spacelabsdk"
SDK_VERSION     = "${@d.getVar('DISTRO_VERSION').replace('snapshot-${DATE}', 'snapshot')}"

DISTRO_VERSION[vardepsexclude] = "DATE"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES:remove = "sysvinit"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
DISTRO_FEATURES:append = " usbhost usbgadget ipv6 largefile"
DISTRO_FEATURES:remove = "3g x11 nfc wayland"

VIRTUAL-RUNTIME_syslog            ?= ""
VIRTUAL-RUNTIME_base-utils-syslog ?= ""

PACKAGE_CLASSES           = "package_ipk"

IMAGE_FSTYPES             ?= "tar.gz wic ext4"
IMAGE_ROOTFS_EXTRA_SPACE  ?= "524288"
IMAGE_LINK_NAME = "flatsat2"
IMAGE_NAME_SUFFIX = ""
EXTRA_IMAGE_FEATURES ?= " \
                          ssh-server-openssh \
                          package-management \
                          "

SDKMACHINE ?= "x86_64"
TOOLCHAIN_HOST_TASK:append   = " nativesdk-cmake nativesdk-pkgconfig"
TOOLCHAIN_TARGET_TASK:append = " packagegroup-core-standalone-sdk-target \
                                 packagegroup-core-sdk"

LICENSE_FLAGS_ACCEPTED:append = " xilinx"
